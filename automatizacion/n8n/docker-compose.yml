# n8n para el copiloto agrónomo (VPS). Uso: copia .env.example a .env, complétalo y
#   docker compose up -d
# n8n queda solo en 127.0.0.1:5678: publícalo con HTTPS detrás de tu proxy (Caddy o Nginx).
# Telegram exige HTTPS para entregar los mensajes al webhook.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Fija N8N_VERSION en .env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMINIO}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_DOMINIO}/
      - N8N_PROXY_HOPS=1
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en .env}
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=America/Lima
      - TZ=America/Lima
    volumes:
      - n8n_datos:/home/node/.n8n

volumes:
  n8n_datos:
