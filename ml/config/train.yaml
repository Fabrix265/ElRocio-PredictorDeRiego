name: riego
seed: 42
reports_dir: ml/reports
models_dir: ml/models

data:
  source:
    type: csv
    path: ml/data/processed/turno_dia.csv
    sheet: null
    column_map: {}
  turno_file: ml/data/processed/turno_dia.csv
  ciclos_file: ml/data/processed/ciclos.csv
  columns_file: ml/data/processed/columnas.json
  date_column: Fecha
  group_column: Turno
  id_columns: [Fecha, Fundo, Modulo, Turno]
  categorical_features: []
  numeric_features: []
  environmental_features: []
  max_cycles: 5
  tail_class: 5
  cycle_column: Ciclo
  target_cycle_columns: [riego_m3ha, inicio_min, duracion_min]
  incomplete_column: dia_incompleto
  exclude_incomplete_from_eval: true
  nro_ciclo_column: Ciclo
  cycle_volume_column: riego_m3ha
  start_column: inicio_min
  end_column: fin_min
  drop_columns: []

split:
  strategy: temporal
  group_column: Fecha
  test_size: 0.2
  validation_size: 0.15
  gap_days: 3
  random_state: 42

targets:
  n_ciclos_column: n_ciclos
  n_ciclos_classes: [1, 2, 3, 4, 5]
  total_column: riego_total_m3ha
  direct_total_model: false

tuning:
  enabled: false
  n_iter: 30
  cv_splits: 4
  n_jobs: -1
  scoring_classification: f1_macro
  scoring_regression: neg_root_mean_squared_error
  target: n_ciclos

schedule:
  min_gap_min: 0
  end_mode: derived

models:
  random_forest:
    enabled: true
    params:
      n_estimators: 300
      max_depth: null
      min_samples_leaf: 1
      min_samples_split: 2
      max_features: sqrt
      class_weight: balanced
    early_stopping:
      enabled: true
      step: 50
      patience: 8
      max_iter: 500

  xgboost:
    enabled: true
    params:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      min_child_weight: 1
    early_stopping:
      enabled: true
      rounds: 50

  svr:
    enabled: true
    params:
      C: 10.0
      epsilon: 0.1
      kernel: rbf
      gamma: scale
      class_weight: balanced
    early_stopping:
      enabled: false

  mlp:
    enabled: true
    params:
      hidden_layer_sizes: [32, 16]
      activation: relu
      solver: adam
      alpha: 0.0001
      learning_rate_init: 0.001
      batch_size: 32
    early_stopping:
      enabled: true
      patience: 15
      max_iter: 200

evaluation:
  regression_metrics:
    - rmse
    - mae
    - r2
    - mbe
    - pearson_r
    - kge
    - nse
    - pbias
    - smape
    - willmott_d
    - medae
    - max_error
  classification_metrics:
    - accuracy
    - balanced_accuracy
    - f1_macro
    - cohen_kappa
  generate_plots: false
  generate_excel: true
  max_gantt_turnos: 6
  top_errors: 20
