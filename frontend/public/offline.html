<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A7042" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sin conexión · Plan de Riego</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #1f1c17;
        background-color: #f4f7f2;
        background-image: radial-gradient(900px 420px at 100% -10%, rgb(163 217 119 / 0.18), transparent 60%);
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: #fff;
        border: 1px solid #e1e7dd;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 18px 48px -12px rgb(18 48 31 / 0.2);
      }
      .icono {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #2f7d4a, #215a36);
        box-shadow: 0 6px 16px -6px rgb(42 112 66 / 0.55);
      }
      h1 { font-size: 20px; line-height: 28px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 21px; color: #5f5849; margin: 0 0 20px; }
      button {
        font: inherit;
        font-weight: 600;
        font-size: 14px;
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: linear-gradient(180deg, #33844f, #2a7042);
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #215a36; outline-offset: 2px; }
      small { display: block; margin-top: 18px; color: #7a7262; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="icono" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 32 32"><path d="M16 5.6s7 7.3 7 12.8a7 7 0 0 1-14 0C9 12.9 16 5.6 16 5.6Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/></svg>
      </div>
      <h1>Sin conexión</h1>
      <p>No hay señal para cargar el Plan de Riego. Revisa el wifi o los datos móviles y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <small>Grupo El Rocío · Plan de riego diario</small>
    </main>
  </body>
</html>
